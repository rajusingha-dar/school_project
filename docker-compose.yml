services:
  mysql:
    image: mysql:8.0
    container_name: learncurve-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: ${DB_NAME:-learncurve}
      MYSQL_USER: ${DB_USER:-learncurve}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      # Host port 3307 so it does not collide with a locally installed MySQL on 3306.
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
